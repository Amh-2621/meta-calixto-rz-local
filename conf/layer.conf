# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "calixto-rz"
BBFILE_PATTERN_calixto-rz = "^${LAYERDIR}/"
BBFILE_PRIORITY_calixto-rz = "15"

LAYERDEPENDS_calixto-rz = "core"
LAYERSERIES_COMPAT_calixto-rz = "scarthgap"
